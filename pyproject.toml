[project]
name = "transcribe-assistant"
version = "0.1.3"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agno>=2.6.0",
    "customtkinter>=5.2.2",
    "faster-whisper>=1.2.1",
    "fastapi>=0.115.0",
    "google-genai>=1.64.0",
    "groq>=1.1.2",
    "markdown>=3.10.2",
    "numpy>=2.4.2",
    "pillow>=12.1.1",
    "python-dotenv>=1.2.1",
    "python-i18n>=0.3.9",
    "python-multipart>=0.0.20",
    "sounddevice>=0.5.5",
    "soundfile>=0.13.1",
    "uvicorn[standard]>=0.34.0",
    "keyring>=25.7.0",
    "cryptography>=46.0.5",
    "pystray>=0.19.5",
    "python-socketio[asyncio]>=5.14.0,<6.0.0",
]

[dependency-groups]
dev = [
    "black>=26.1.0",
    "httpx>=0.28.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.25.0",
]

[tool.black]
line-length = 88
target-version = ['py310']
# O regex abaixo protege .agent, docs e .venv
extend-exclude = '''
/(
    \.agent
  | \.venv
  | docs
)/
'''
